name: Update newsletter manifest

# Adding newsletter/issues/YYYY-MM-DD.md is all that is needed to publish an issue:
# this rebuilds newsletter/issues.json from the Markdown files and commits it.
on:
  push:
    branches: [main]
    paths:
      - "newsletter/issues/*.md"
      - "newsletter/build-manifest.mjs"

permissions:
  contents: write

concurrency:
  group: newsletter-manifest
  cancel-in-progress: false

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the manifest
        run: node newsletter/build-manifest.mjs

      - name: Commit the manifest if it changed
        run: |
          if git diff --quiet -- newsletter/issues.json; then
            echo "issues.json is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add newsletter/issues.json
          git commit -m "Update newsletter manifest"
          git push
