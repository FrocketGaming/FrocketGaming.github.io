<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Viewer - QoL Tools</title>
    <script>
        (function() {
            var theme = localStorage.getItem('qol-tools-theme');
            if (theme && theme !== 'default') {
                document.documentElement.setAttribute('data-theme', theme);
            }
        })();
    </script>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="stylesheet" href="../../src/stylesheet.css">
    <link rel="stylesheet" href="json-viewer-styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body class="raleway-fnt">
    <div class="header">
        <div class="header-icon-row">
            <a href="/" class="logo" style="text-decoration:none;color:inherit;">QoL Tools</a>
            <nav class="nav-icon-rail">
                <a href="../txt-formatter/index.html" title="Txt Formatter"><i class="fa-solid fa-font"></i></a>
                <a href="../snippets/index.html" title="Snippets"><i class="fa-solid fa-code"></i></a>
                <a href="../todo/index.html" title="To-Do List"><i class="fa-solid fa-list-check"></i></a>
                <a href="../csv-viewer/index.html" title="CSV Viewer"><i class="fa-solid fa-table"></i></a>
                <a href="../regex-tester/index.html" title="Regex Tester"><i class="fa-solid fa-asterisk"></i></a>
                <a href="../image-editor/index.html" title="Image Editor"><i class="fa-solid fa-image"></i></a>
                <a href="../cron-builder/index.html" title="Cron Builder"><i class="fa-solid fa-calendar-days"></i></a>
                <a href="../timezone/index.html" title="Timezone"><i class="fa-solid fa-globe"></i></a>
                <a href="../text-diff/index.html" title="Text Diff"><i class="fa-solid fa-code-compare"></i></a>
                <a href="../json-viewer/index.html" class="active" title="JSON Viewer"><i class="fa-solid fa-file-code"></i></a>
            </nav>
            <div class="theme-selector">
                <label for="themeSelect">Theme:</label>
                <select id="themeSelect" class="theme-select"></select>
            </div>
        </div>
    </div>

    <p>Paste JSON to validate, format, and explore it as an interactive tree. Click any key to copy its path.</p>

    <div class="json-container">

        <div class="json-toolbar">
            <button class="format-btn" id="formatBtn">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Format
            </button>
            <button class="toolbar-btn" id="minifyBtn" title="Minify JSON">
                <i class="fa-solid fa-compress-alt"></i> Minify
            </button>
            <button class="toolbar-btn" id="expandAllBtn" title="Expand all nodes">
                <i class="fa-solid fa-expand"></i> Expand All
            </button>
            <button class="toolbar-btn" id="collapseAllBtn" title="Collapse all nodes">
                <i class="fa-solid fa-compress"></i> Collapse All
            </button>
            <button class="toolbar-btn" id="copyFormattedBtn" title="Copy formatted JSON">
                <i class="fa-solid fa-copy"></i> Copy JSON
            </button>
            <button class="toolbar-btn toolbar-btn-clear" id="clearBtn">Clear</button>
            <span class="json-stats" id="jsonStats"></span>
        </div>

        <div class="json-panels">
            <div class="json-input-panel">
                <div class="json-panel-label">Input</div>
                <textarea id="jsonInput" placeholder='Paste JSON here…' spellcheck="false"></textarea>
            </div>
            <div class="json-output-panel">
                <div class="json-panel-label">
                    Tree
                    <span class="json-path-hint" id="pathHint">click any key to copy its path</span>
                </div>
                <div class="json-search-bar" id="searchBar">
                    <i class="fa-solid fa-magnifying-glass json-search-icon"></i>
                    <input type="text" id="searchInput" class="json-search-input" placeholder="Search keys and values… (Ctrl+F)">
                    <span class="json-search-count" id="searchCount"></span>
                    <button class="json-search-nav" id="searchPrev" title="Previous match (Shift+Enter)" disabled><i class="fa-solid fa-chevron-up"></i></button>
                    <button class="json-search-nav" id="searchNext" title="Next match (Enter)" disabled><i class="fa-solid fa-chevron-down"></i></button>
                    <button class="json-search-clear" id="searchClear" title="Clear search" style="display:none"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div id="jsonTree" class="json-tree">
                    <div class="json-empty-state">
                        <i class="fa-solid fa-code"></i>
                        <p>Paste JSON on the left to explore it here</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="json-error" id="jsonError"></div>

    </div>

    <div class="copy-notification" id="copyNotification">Copied!</div>

    <script src="../../src/theme-manager.js"></script>
    <script src="../../src/funcs.js"></script>
    <script src="json-viewer-app.js"></script>
<!-- impeccable-live-start -->
<script src="http://localhost:8400/live.js?token=518680a5-2220-4948-abb0-bc81219946ad"></script>
<!-- impeccable-live-end -->
</body>

</html>
