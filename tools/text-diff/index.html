<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Diff - QoL Tools</title>
    <script>
        (function() {
            var theme = localStorage.getItem('qol-tools-theme');
            if (theme && theme !== 'default') {
                document.documentElement.setAttribute('data-theme', theme);
            }
        })();
    </script>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="stylesheet" href="../../src/stylesheet.css">
    <link rel="stylesheet" href="text-diff-styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body class="raleway-fnt">
    <div class="header">
        <div class="header-icon-row">
            <a href="/" class="logo" style="text-decoration:none;color:inherit;">QoL Tools</a>
            <nav class="nav-icon-rail">
                <a href="../txt-formatter/index.html" title="Txt Formatter"><i class="fa-solid fa-font"></i></a>
                <a href="../snippets/index.html" title="Snippets"><i class="fa-solid fa-code"></i></a>
                <a href="../todo/index.html" title="To-Do List"><i class="fa-solid fa-list-check"></i></a>
                <a href="../csv-viewer/index.html" title="CSV Viewer"><i class="fa-solid fa-table"></i></a>
                <a href="../regex-tester/index.html" title="Regex Tester"><i class="fa-solid fa-asterisk"></i></a>
                <a href="../image-editor/index.html" title="Image Editor"><i class="fa-solid fa-image"></i></a>
                <a href="../cron-builder/index.html" title="Cron Builder"><i class="fa-solid fa-calendar-days"></i></a>
                <a href="../timezone/index.html" title="Timezone"><i class="fa-solid fa-globe"></i></a>
                <a href="../text-diff/index.html" class="active" title="Text Diff"><i class="fa-solid fa-code-compare"></i></a>
                <a href="../json-viewer/index.html" title="JSON Viewer"><i class="fa-solid fa-file-code"></i></a>
            </nav>
            <div class="theme-selector">
                <label for="themeSelect">Theme:</label>
                <select id="themeSelect" class="theme-select"></select>
            </div>
        </div>
    </div>

    <p>Compare two texts and see highlighted differences. All processing is done locally in your browser.</p>


    <div class="diff-container">
        <div class="diff-toolbar">
            <button class="toolbar-btn diff-view-btn active" id="unifiedBtn" title="Unified view">
                <i class="fa-solid fa-list"></i> Unified
            </button>
            <button class="toolbar-btn diff-view-btn" id="sideBySideBtn" title="Side-by-side view">
                <i class="fa-solid fa-columns"></i> Side-by-Side
            </button>
            <label class="diff-checkbox-label">
                <input type="checkbox" id="hideUnchanged" checked> Hide unchanged
            </label>
            <label class="diff-checkbox-label">
                <input type="checkbox" id="ignoreWhitespace"> Ignore whitespace
            </label>
            <label class="diff-checkbox-label">
                <input type="checkbox" id="ignoreCase"> Ignore case
            </label>
            <button class="format-btn" id="compareBtn">
                <i class="fa-solid fa-code-compare"></i> Compare
            </button>
            <button class="toolbar-btn" id="swapBtn" title="Swap texts">
                <i class="fa-solid fa-right-left"></i> Swap
            </button>
            <button class="toolbar-btn toolbar-btn-clear" id="clearBtn">Clear</button>
        </div>

        <div class="diff-input-panels">
            <div class="diff-input-panel">
                <input type="text" id="leftLabel" class="diff-label-input" value="Original" placeholder="Label…" spellcheck="false">
                <textarea id="originalText" placeholder="Paste original text here..." spellcheck="false"></textarea>
            </div>
            <div class="diff-input-panel">
                <input type="text" id="rightLabel" class="diff-label-input" value="Modified" placeholder="Label…" spellcheck="false">
                <textarea id="modifiedText" placeholder="Paste modified text here..." spellcheck="false"></textarea>
            </div>
        </div>

        <div class="diff-stats" id="diffStats"></div>

        <div class="diff-output" id="diffOutput"></div>
    </div>


    <script src="../../src/theme-manager.js"></script>
    <script src="../../src/funcs.js"></script>
    <script src="text-diff-app.js"></script>
<!-- impeccable-live-start -->
<script src="http://localhost:8400/live.js?token=518680a5-2220-4948-abb0-bc81219946ad"></script>
<!-- impeccable-live-end -->
</body>

</html>
