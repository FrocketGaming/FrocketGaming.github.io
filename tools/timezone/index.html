<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timezone Converter - QoL Tools</title>
    <script>
        (function() {
            var theme = localStorage.getItem('qol-tools-theme');
            if (theme && theme !== 'default') {
                document.documentElement.setAttribute('data-theme', theme);
            }
        })();
    </script>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="stylesheet" href="../../src/stylesheet.css">
    <link rel="stylesheet" href="timezone-styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body class="raleway-fnt">
    <div class="header">
        <div class="header-icon-row">
            <a href="/" class="logo" style="text-decoration:none;color:inherit;">QoL Tools</a>
            <nav class="nav-icon-rail">
                <a href="../txt-formatter/index.html" title="Txt Formatter"><i class="fa-solid fa-font"></i></a>
                <a href="../snippets/index.html" title="Snippets"><i class="fa-solid fa-code"></i></a>
                <a href="../todo/index.html" title="To-Do List"><i class="fa-solid fa-list-check"></i></a>
                <a href="../csv-viewer/index.html" title="CSV Viewer"><i class="fa-solid fa-table"></i></a>
                <a href="../regex-tester/index.html" title="Regex Tester"><i class="fa-solid fa-asterisk"></i></a>
                <a href="../image-editor/index.html" title="Image Editor"><i class="fa-solid fa-image"></i></a>
                <a href="../cron-builder/index.html" title="Cron Builder"><i class="fa-solid fa-calendar-days"></i></a>
                <a href="../timezone/index.html" class="active" title="Timezone"><i class="fa-solid fa-globe"></i></a>
                <a href="../text-diff/index.html" title="Text Diff"><i class="fa-solid fa-code-compare"></i></a>
                <a href="../json-viewer/index.html" title="JSON Viewer"><i class="fa-solid fa-file-code"></i></a>
            </nav>
            <div class="theme-selector">
                <label for="themeSelect">Theme:</label>
                <select id="themeSelect" class="theme-select"></select>
            </div>
        </div>
    </div>

    <div class="tz-container">
        <!-- Left Column: Converter + World Clock -->
        <div class="tz-left-col">
            <!-- Converter Section -->
            <div class="tz-converter">
                <h3><i class="fa-solid fa-right-left"></i> Timezone Converter</h3>
                <div class="tz-source">
                    <div class="tz-row">
                        <label>Source</label>
                        <input type="datetime-local" id="sourceDateTime" step="60" aria-label="Source date and time">
                        <div id="sourceTimezonePicker"></div>
                    </div>
                </div>
                <div class="tz-targets" id="targetContainer"></div>
            </div>

            <!-- World Clock Section -->
            <div class="tz-world-clock">
                <h3><i class="fa-solid fa-globe"></i> World Clock</h3>
                <div class="tz-clock-grid" id="clockGrid"></div>
            </div>
        </div>

        <!-- Right Column: Meeting Planner -->
        <div class="tz-meeting-planner">
            <div class="tz-section-header">
                <h3><i class="fa-solid fa-calendar-check"></i> Meeting Planner</h3>
                <div class="tz-planner-controls">
                    <label>Source Hour:</label>
                    <select id="plannerHour" class="tz-select" aria-label="Source hour"></select>
                    <label>in</label>
                    <div id="plannerSourceTzPicker"></div>
                </div>
            </div>
            <div class="tz-planner-grid" id="plannerGrid"></div>
            <div class="tz-planner-legend">
                <span class="tz-legend-item"><span class="tz-legend-swatch tz-hour-good"></span> Business hours (9-17)</span>
                <span class="tz-legend-item"><span class="tz-legend-swatch tz-hour-ok"></span> Early/Late (7-9, 17-21)</span>
                <span class="tz-legend-item"><span class="tz-legend-swatch tz-hour-bad"></span> Night (21-7)</span>
            </div>
        </div>
    </div>

    <script src="../../src/theme-manager.js"></script>
    <script src="../../src/funcs.js"></script>
    <script src="timezone-app.js"></script>
<!-- impeccable-live-start -->
<script src="http://localhost:8400/live.js?token=518680a5-2220-4948-abb0-bc81219946ad"></script>
<!-- impeccable-live-end -->
</body>

</html>
