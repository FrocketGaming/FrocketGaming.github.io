<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timezone Converter - QoL Tools</title>
    <script>
        (function() {
            var theme = localStorage.getItem('qol-tools-theme');
            if (theme && theme !== 'default') {
                document.documentElement.setAttribute('data-theme', theme);
            }
        })();
    </script>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="stylesheet" href="../../src/stylesheet.css">
    <link rel="stylesheet" href="timezone-styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400..800&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body class="raleway-fnt">
    <div class="header">
        <div class="header-icon-row">
            <nav class="nav-pill-rail">
                <a class="nav-pill-item" href="../txt-formatter/index.html"><i class="fa-solid fa-font"></i><span class="nav-pill-label"><span class="nav-pill-label-text">Txt Formatter</span></span></a>
                <a class="nav-pill-item" href="../snippets/index.html"><i class="fa-solid fa-code"></i><span class="nav-pill-label"><span class="nav-pill-label-text">Snippets</span></span></a>
                <a class="nav-pill-item" href="../todo/index.html"><i class="fa-solid fa-list-check"></i><span class="nav-pill-label"><span class="nav-pill-label-text">To-Do List</span></span></a>
                <a class="nav-pill-item" href="../csv-viewer/index.html"><i class="fa-solid fa-table"></i><span class="nav-pill-label"><span class="nav-pill-label-text">CSV Viewer</span></span></a>
                <a class="nav-pill-item" href="../regex-tester/index.html"><i class="fa-solid fa-asterisk"></i><span class="nav-pill-label"><span class="nav-pill-label-text">Regex Tester</span></span></a>
                <a class="nav-pill-item" href="../image-editor/index.html"><i class="fa-solid fa-image"></i><span class="nav-pill-label"><span class="nav-pill-label-text">Image Editor</span></span></a>
                <a class="nav-pill-item" href="../cron-builder/index.html"><i class="fa-solid fa-calendar-days"></i><span class="nav-pill-label"><span class="nav-pill-label-text">Cron Builder</span></span></a>
                <a class="nav-pill-item active" href="../timezone/index.html"><i class="fa-solid fa-globe"></i><span class="nav-pill-label"><span class="nav-pill-label-text">Timezone</span></span></a>
                <a class="nav-pill-item" href="../text-diff/index.html"><i class="fa-solid fa-code-compare"></i><span class="nav-pill-label"><span class="nav-pill-label-text">Text Diff</span></span></a>
                <a class="nav-pill-item" href="../json-viewer/index.html"><i class="fa-solid fa-file-code"></i><span class="nav-pill-label"><span class="nav-pill-label-text">JSON Viewer</span></span></a>
            </nav>
            <div class="theme-selector">
                <label for="themeSelect">Theme:</label>
                <select id="themeSelect" class="theme-select"></select>
            </div>
        </div>
    </div>

    <div class="tz-container">
        <!-- Converter Section -->
        <div class="tz-converter">
            <h3><i class="fa-solid fa-right-left"></i> Timezone Converter</h3>
            <div class="tz-source">
                <div class="tz-row">
                    <label>Source</label>
                    <input type="datetime-local" id="sourceDateTime" step="60" aria-label="Source date and time">
                    <div id="sourceTimezonePicker"></div>
                </div>
            </div>
            <div class="tz-targets" id="targetContainer"></div>
        </div>

        <!-- Timeline Section -->
        <div class="tz-timeline">
            <div class="tz-timeline-header">
                <h3><i class="fa-solid fa-timeline"></i> Timeline</h3>
                <div class="tz-timeline-nav">
                    <button id="tlPrevDay" class="tz-nav-btn" title="Previous day" aria-label="Previous day"><i class="fa-solid fa-chevron-left"></i></button>
                    <button id="tlToday" class="tz-nav-btn tz-nav-today">Today</button>
                    <button id="tlNextDay" class="tz-nav-btn" title="Next day" aria-label="Next day"><i class="fa-solid fa-chevron-right"></i></button>
                    <span class="tz-timeline-date" id="tlDateLabel"></span>
                </div>
            </div>

            <div class="tz-timeline-readout" id="tlReadout">Hover the timeline to scrub · click to pin a time</div>

            <div class="tz-timeline-scroll">
                <div class="tz-timeline-rows" id="tlRows"></div>
            </div>

            <div class="tz-section-add" id="tlAddRow"></div>

            <div class="tz-planner-legend">
                <span class="tz-legend-item"><span class="tz-legend-swatch tz-hour-good"></span> Business hours (9-17)</span>
                <span class="tz-legend-item"><span class="tz-legend-swatch tz-hour-ok"></span> Early/Late (7-9, 17-21)</span>
                <span class="tz-legend-item"><span class="tz-legend-swatch tz-hour-bad"></span> Night (21-7)</span>
                <span class="tz-legend-item"><span class="tz-legend-swatch tz-weekend-swatch"></span> Weekend</span>
            </div>
        </div>
    </div>

    <script src="../../src/theme-manager.js"></script>
    <script src="../../src/funcs.js"></script>
    <script src="timezone-app.js"></script>
<!-- impeccable-live-start -->
<!-- impeccable-live-end -->
</body>

</html>
