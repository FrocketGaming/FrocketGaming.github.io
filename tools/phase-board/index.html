        <script>
            // Pre-paint: apply the visitor's theme before first render so there is no flash of the
            // wrong palette. Mirrors ThemeManager.getSavedTheme() in src/theme-manager.js.
            (function() {
                var theme = document.documentElement.getAttribute('data-default-theme') || 'canary';
                try {
                    theme = localStorage.getItem('qol-tools-theme') || theme;
                } catch (e) {}
                if (theme === 'dunder') { theme = 'canary'; }
                if (theme && theme !== 'default') {
                    document.documentElement.setAttribute('data-theme', theme);
                }
            })();
        </script>
