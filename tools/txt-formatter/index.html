<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Txt Formatter - QoL Tools</title>
        <script>
            (function () {
                var theme = localStorage.getItem("qol-tools-theme");
                if (theme && theme !== "default") {
                    document.documentElement.setAttribute("data-theme", theme);
                }
            })();
        </script>
        <link rel="icon" type="image/png" href="/images/logo.png" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
        />
        <link rel="stylesheet" href="../../src/stylesheet.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />
    </head>

    <body class="raleway-fnt">
        <div class="header">
            <div class="header-top">
                <a href="/" class="logo" style="text-decoration:none;color:inherit;">QoL Tools</a>
                <div class="theme-selector">
                    <label for="themeSelect">Theme:</label>
                    <select id="themeSelect" class="theme-select"></select>
                </div>
            </div>
            <nav class="tool-nav">
                <a href="../txt-formatter/index.html" class="tool-btn active">txt formatter</a>
                <a href="../snippets/index.html" class="tool-btn">snippets</a>
                <a href="../todo/index.html" class="tool-btn">to-do list</a>
                <a href="../csv-viewer/index.html" class="tool-btn">csv viewer</a>
                <a href="../regex-tester/index.html" class="tool-btn">regex tester</a>
                <a href="../image-editor/index.html" class="tool-btn">image editor</a>
                <a href="../chart-builder/index.html" class="tool-btn">chart builder</a>
                <a href="../cron-builder/index.html" class="tool-btn">cron builder</a>
                <a href="../timezone/index.html" class="tool-btn">timezone</a>
                <a href="../text-diff/index.html" class="tool-btn">text diff</a>
            </nav>
        </div>
        <p>Transform, format, and manipulate text with the tools below.</p>
        <div class="formatter-layout">
            <div class="toolbar">
                <div class="toolbar-group dropdown">
                    <button
                        class="toolbar-btn"
                        onclick="toggleDropdown('listDropdown')"
                    >
                        List Format <i class="fa-solid fa-caret-down"></i>
                    </button>
                    <div id="listDropdown" class="toolbar-dropdown">
                        <div class="dropdown-form">
                            <label>Separator</label>
                            <select id="separatorSelect">
                                <option value=", ">Comma</option>
                                <option value="\n">Newline</option>
                                <option value=" | ">Pipe</option>
                                <option value="\t">Tab</option>
                                <option value="; ">Semicolon</option>
                                <option value="custom">Custom...</option>
                            </select>
                            <input
                                type="text"
                                id="customSeparator"
                                class="custom-sep-input hidden"
                                placeholder="Enter separator"
                            />
                            <label>Quote Style</label>
                            <select id="quoteStyleSelect">
                                <option value="none">None</option>
                                <option value="single">Single quotes</option>
                                <option value="double">Double quotes</option>
                                <option value="backtick">Backticks</option>
                            </select>
                            <div class="dropdown-toggle-row">
                                <label for="parenToggle"
                                    >Wrap in parentheses</label
                                >
                                <input type="checkbox" id="parenToggle" />
                            </div>
                            <button
                                class="dropdown-apply-btn"
                                onclick="formatList()"
                            >
                                Apply
                            </button>
                        </div>
                    </div>
                </div>

                <div class="toolbar-group dropdown">
                    <button
                        class="toolbar-btn"
                        onclick="toggleDropdown('caseDropdown')"
                    >
                        Case <i class="fa-solid fa-caret-down"></i>
                    </button>
                    <div id="caseDropdown" class="toolbar-dropdown">
                        <button
                            class="dropdown-item"
                            onclick="convertCase('upper')"
                        >
                            UPPERCASE
                        </button>
                        <button
                            class="dropdown-item"
                            onclick="convertCase('lower')"
                        >
                            lowercase
                        </button>
                        <button
                            class="dropdown-item"
                            onclick="convertCase('title')"
                        >
                            Title Case
                        </button>
                        <button
                            class="dropdown-item"
                            onclick="convertCase('camel')"
                        >
                            camelCase
                        </button>
                        <button
                            class="dropdown-item"
                            onclick="convertCase('snake')"
                        >
                            snake_case
                        </button>
                        <button
                            class="dropdown-item"
                            onclick="convertCase('kebab')"
                        >
                            kebab-case
                        </button>
                        <button
                            class="dropdown-item"
                            onclick="convertCase('pascal')"
                        >
                            PascalCase
                        </button>
                        <button
                            class="dropdown-item"
                            onclick="convertCase('constant')"
                        >
                            CONSTANT_CASE
                        </button>
                    </div>
                </div>

                <div class="toolbar-group dropdown">
                    <button
                        class="toolbar-btn"
                        onclick="toggleDropdown('sortDropdown')"
                    >
                        Sort <i class="fa-solid fa-caret-down"></i>
                    </button>
                    <div id="sortDropdown" class="toolbar-dropdown">
                        <button
                            class="dropdown-item"
                            onclick="sortLines('asc')"
                        >
                            Sort A-Z
                        </button>
                        <button
                            class="dropdown-item"
                            onclick="sortLines('desc')"
                        >
                            Sort Z-A
                        </button>
                        <button class="dropdown-item" onclick="sortNumeric()">
                            Sort Numeric
                        </button>
                        <button
                            class="dropdown-item"
                            onclick="removeDuplicates(false)"
                        >
                            Remove Duplicates
                        </button>
                        <button
                            class="dropdown-item"
                            onclick="removeDuplicates(true)"
                        >
                            Remove Duplicates + Sort
                        </button>
                    </div>
                </div>

                <div class="toolbar-group dropdown">
                    <button
                        class="toolbar-btn"
                        onclick="toggleDropdown('jsonDropdown')"
                    >
                        JSON <i class="fa-solid fa-caret-down"></i>
                    </button>
                    <div id="jsonDropdown" class="toolbar-dropdown">
                        <button class="dropdown-item" onclick="prettifyJSON()">
                            Prettify JSON
                        </button>
                        <button class="dropdown-item" onclick="minifyJSON()">
                            Minify JSON
                        </button>
                    </div>
                </div>

                <div class="toolbar-group dropdown">
                    <button
                        class="toolbar-btn"
                        onclick="toggleDropdown('findReplaceDropdown')"
                    >
                        Find & Replace <i class="fa-solid fa-caret-down"></i>
                    </button>
                    <div id="findReplaceDropdown" class="toolbar-dropdown">
                        <div class="dropdown-form">
                            <label>Find</label>
                            <input
                                type="text"
                                id="findInput"
                                placeholder="Search text..."
                            />
                            <label>Replace</label>
                            <input
                                type="text"
                                id="replaceInput"
                                placeholder="Replace with..."
                            />
                            <div class="dropdown-toggle-row">
                                <label for="regexToggle">Regex</label>
                                <input type="checkbox" id="regexToggle" />
                            </div>
                            <div class="dropdown-toggle-row">
                                <label for="caseSensitiveToggle"
                                    >Case sensitive</label
                                >
                                <input
                                    type="checkbox"
                                    id="caseSensitiveToggle"
                                />
                            </div>
                            <button
                                class="dropdown-apply-btn"
                                onclick="findAndReplace()"
                            >
                                Replace All
                            </button>
                        </div>
                    </div>
                </div>

                <div class="toolbar-group dropdown">
                    <button
                        class="toolbar-btn"
                        onclick="toggleDropdown('trimCleanDropdown')"
                    >
                        Trim/Clean <i class="fa-solid fa-caret-down"></i>
                    </button>
                    <div id="trimCleanDropdown" class="toolbar-dropdown">
                        <button
                            class="dropdown-item"
                            onclick="trimWhitespace()"
                        >
                            Trim Whitespace
                        </button>
                        <button
                            class="dropdown-item"
                            onclick="removeEmptyLines()"
                        >
                            Remove Empty Lines
                        </button>
                        <button
                            class="dropdown-item"
                            onclick="removeExtraSpaces()"
                        >
                            Remove Extra Spaces
                        </button>
                        <button
                            class="dropdown-item"
                            onclick="removeDuplicates(false)"
                        >
                            Remove Duplicate Lines
                        </button>
                        <button
                            class="dropdown-item"
                            onclick="stripHtmlTags()"
                        >
                            Strip HTML Tags
                        </button>
                        <button
                            class="dropdown-item"
                            onclick="addLineNumbers()"
                        >
                            Add Line Numbers
                        </button>
                        <button
                            class="dropdown-item"
                            onclick="removeLineNumbers()"
                        >
                            Remove Line Numbers
                        </button>
                    </div>
                </div>

                <div class="toolbar-spacer"></div>
                <button class="toolbar-btn" onclick="copyToClipboard()">
                    <i class="fa-solid fa-copy"></i> Copy
                </button>
                <button
                    class="toolbar-btn toolbar-btn-clear"
                    onclick="clearOutput()"
                >
                    Clear
                </button>
            </div>

            <div class="columns-row">
                <div class="box">
                    <textarea
                        id="input"
                        placeholder="Enter text, items, JSON, or SQL..."
                    ></textarea>
                </div>
                <div class="box output-box">
                    <textarea id="output" readonly></textarea>
                    <div class="copy-popup">Text copied</div>
                </div>
            </div>

            <div class="stats-bar" id="statsBar">
                <span id="charCount">0 chars</span>
                <span class="stats-sep">|</span>
                <span id="wordCount">0 words</span>
                <span class="stats-sep">|</span>
                <span id="lineCount">0 lines</span>
            </div>
        </div>
        <script src="../../src/theme-manager.js"></script>
        <script src="../../src/funcs.js"></script>
    </body>
</html>
