<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Viewer - QoL Tools</title>
    <script>
        (function() {
            var theme = localStorage.getItem('qol-tools-theme');
            if (theme && theme !== 'default') {
                document.documentElement.setAttribute('data-theme', theme);
            }
        })();
    </script>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="stylesheet" href="../../src/stylesheet.css">
    <link rel="stylesheet" href="csv-styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body class="raleway-fnt">
    <div class="header">
        <div class="header-icon-row">
            <a href="/" class="logo" style="text-decoration:none;color:inherit;">QoL Tools</a>
            <nav class="nav-icon-rail">
                <a href="../txt-formatter/index.html" title="Txt Formatter"><i class="fa-solid fa-font"></i></a>
                <a href="../snippets/index.html" title="Snippets"><i class="fa-solid fa-code"></i></a>
                <a href="../todo/index.html" title="To-Do List"><i class="fa-solid fa-list-check"></i></a>
                <a href="../csv-viewer/index.html" class="active" title="CSV Viewer"><i class="fa-solid fa-table"></i></a>
                <a href="../regex-tester/index.html" title="Regex Tester"><i class="fa-solid fa-asterisk"></i></a>
                <a href="../image-editor/index.html" title="Image Editor"><i class="fa-solid fa-image"></i></a>
                <a href="../cron-builder/index.html" title="Cron Builder"><i class="fa-solid fa-calendar-days"></i></a>
                <a href="../timezone/index.html" title="Timezone"><i class="fa-solid fa-globe"></i></a>
                <a href="../text-diff/index.html" title="Text Diff"><i class="fa-solid fa-code-compare"></i></a>
                <a href="../json-viewer/index.html" title="JSON Viewer"><i class="fa-solid fa-file-code"></i></a>
            </nav>
            <div class="theme-selector">
                <label for="themeSelect">Theme:</label>
                <select id="themeSelect" class="theme-select"></select>
            </div>
        </div>
    </div>

    <p>Upload a CSV file to view and query it. All processing is done locally in your browser.</p>

    <div class="csv-container">
        <div class="controls">
            <label for="delimiter">Delimiter:</label>
            <select id="delimiter" class="delimiter-select">
                <option value="auto">Auto-detect</option>
                <option value=",">Comma (,)</option>
                <option value=";">Semicolon (;)</option>
                <option value="\t">Tab</option>
                <option value="|">Pipe (|)</option>
            </select>
            <input type="file" id="fileInput" accept=".csv,.txt" style="display: none;">
            <button id="uploadBtn" class="format-btn">
                <i class="fa-solid fa-upload"></i> Upload CSV
            </button>
            <button id="pasteBtn" class="format-btn">
                <i class="fa-solid fa-clipboard"></i> Paste CSV
            </button>
            <button id="clearBtn" class="clear-bnt">Clear</button>
        </div>

        <div id="pasteArea" class="csv-paste-area" style="display:none;">
            <textarea id="pasteInput" placeholder="Paste CSV content here..." spellcheck="false"></textarea>
            <div class="csv-paste-actions">
                <button id="pasteLoadBtn" class="format-btn"><i class="fa-solid fa-table"></i> Load</button>
                <button id="pasteCancelBtn" class="clear-bnt">Cancel</button>
            </div>
        </div>

        <div id="dataProfileSection" class="data-profile-section" style="display: none;">
            <div class="data-profile-header">
                <h3><i class="fa-solid fa-chart-simple"></i> Data Profile</h3>
                <span class="data-profile-summary" id="profileSummary"></span>
                <button id="profileToggleBtn" class="profile-toggle-btn">
                    <i class="fa-solid fa-chevron-up"></i>
                </button>
            </div>
            <div id="profileContent" class="data-profile-content">
                <div class="table-container" id="profileTableContainer"></div>
            </div>
        </div>

        <div id="sqlSection" class="csv-main-content" style="display: none;">
            <div class="left-column">
                <div class="sql-panel">
                    <div class="sql-header">
                        <h3><i class="fa-solid fa-database"></i> SQL Playground</h3>
                        <span id="sqlStatus" class="sql-status">Ready</span>
                    </div>
                    <div id="sqlExamples" class="sql-examples"></div>
                    <div class="sql-editor-container">
                        <pre class="sql-highlight-layer" aria-hidden="true"><code id="sqlHighlight"></code></pre>
                        <textarea id="sqlQuery" class="sql-query-input" rows="2" spellcheck="false"
                            placeholder="Write SQL queries against the 'csv' table...&#10;Example: SELECT * FROM csv LIMIT 10"></textarea>
                    </div>
                    <div class="sql-controls">
                        <button id="sqlRunBtn" class="format-btn"><i class="fa-solid fa-play"></i> Run Query</button>
                        <button id="sqlExportBtn" class="format-btn">Export Results</button>
                        <span id="sqlQueryInfo" class="sql-query-info"></span>
                    </div>
                    <div id="sqlError" class="sql-error"></div>
                </div>
            </div>

            <div class="right-column">
                <div id="sqlResultsWrapper" class="sql-results-wrapper">
                    <div class="table-container" id="sqlResultsContainer"></div>
                </div>
                <div id="sqlResultsInfo" class="table-info"></div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
    <script src="../../src/theme-manager.js"></script>
    <script src="../../src/funcs.js"></script>
    <script src="csv-app.js"></script>

</body>

</html>
