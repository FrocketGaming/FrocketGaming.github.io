<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Viewer - QoL Tools</title>
    <script>
        (function() {
            var theme = localStorage.getItem('qol-tools-theme');
            if (theme && theme !== 'default') {
                document.documentElement.setAttribute('data-theme', theme);
            }
        })();
    </script>
    <link rel="icon" type="image/png" sizes="16x16" href="/images/fav.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="stylesheet" href="../../src/stylesheet.css">
    <link rel="stylesheet" href="csv-styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body class="raleway-fnt">
    <div class="header">
        <div class="header-top">
            <div class="logo">QoL Tools</div>
            <div class="theme-selector">
                <label for="themeSelect">Theme:</label>
                <select id="themeSelect" class="theme-select"></select>
            </div>
        </div>
        <nav class="tool-nav">
            <a href="../txt-formatter/index.html" class="tool-btn">txt formatter</a>
            <a href="../snippets/index.html" class="tool-btn">snippets</a>
            <a href="../todo/index.html" class="tool-btn">to-do list</a>
            <a href="../csv-viewer/index.html" class="tool-btn active">csv viewer</a>
            <a href="../regex-tester/index.html" class="tool-btn">regex tester</a>
            <a href="../markdown/index.html" class="tool-btn">markdown preview</a>
            <a href="../epoch-converter/index.html" class="tool-btn">epoch converter</a>
            <a href="../cron-builder/index.html" class="tool-btn">cron builder</a>
            <a href="../timezone/index.html" class="tool-btn">timezone</a>
            <a href="../text-diff/index.html" class="tool-btn">text diff</a>
        </nav>
    </div>

    <p>Upload a CSV file to view and query it. All processing is done locally in your browser.</p>

    <div class="csv-container">
        <div class="controls">
            <label for="delimiter">Delimiter:</label>
            <select id="delimiter" class="delimiter-select">
                <option value="auto">Auto-detect</option>
                <option value=",">Comma (,)</option>
                <option value=";">Semicolon (;)</option>
                <option value="\t">Tab</option>
                <option value="|">Pipe (|)</option>
            </select>
            <input type="file" id="fileInput" accept=".csv,.txt" style="display: none;">
            <button id="uploadBtn" class="format-btn">
                <i class="fa-solid fa-upload"></i> Upload CSV
            </button>
            <button id="clearBtn" class="clear-bnt">Clear</button>
        </div>

        <div class="csv-main-content">
            <div class="left-column">
                <div class="table-wrapper">
                    <div id="tableContainer" class="table-container">
                        <div class="empty-state">Upload a CSV file to get started</div>
                    </div>
                </div>
                <div id="tableInfo" class="table-info"></div>
            </div>

            <div id="sqlSection" class="right-column" style="display: none;">
                <div class="sql-header">
                    <h3><i class="fa-solid fa-database"></i> SQL Playground</h3>
                    <span id="sqlStatus" class="sql-status">Ready</span>
                </div>
                <div id="sqlExamples" class="sql-examples"></div>
                <div class="sql-editor-container">
                    <pre class="sql-highlight-layer" aria-hidden="true"><code id="sqlHighlight"></code></pre>
                    <textarea id="sqlQuery" class="sql-query-input" rows="2" spellcheck="false"
                        placeholder="Write SQL queries against the 'csv' table...&#10;Example: SELECT * FROM csv LIMIT 10"></textarea>
                </div>
                <div class="sql-controls">
                    <button id="sqlRunBtn" class="format-btn"><i class="fa-solid fa-play"></i> Run Query</button>
                    <button id="sqlExportBtn" class="format-btn">Export Results</button>
                    <span id="sqlQueryInfo" class="sql-query-info"></span>
                </div>
                <div id="sqlError" class="sql-error"></div>
                <div id="sqlResultsWrapper" class="sql-results-wrapper">
                    <div class="table-container" id="sqlResultsContainer"></div>
                </div>
                <div id="sqlResultsInfo" class="table-info"></div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
    <script src="../../src/theme-manager.js"></script>
    <script src="../../src/funcs.js"></script>
    <script src="csv-app.js"></script>
</body>

</html>
