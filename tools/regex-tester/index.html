    <p>Test and debug regular expressions in real-time. All processing is done locally in your browser.</p>

    <div class="regex-container">
        <div class="examples-section">
            <h3>Common Patterns</h3>
            <div class="category-tabs">
                <button class="category-tab active" data-category="web">Web</button>
                <button class="category-tab" data-category="programming">Programming</button>
                <button class="category-tab" data-category="numbers">Numbers</button>
                <button class="category-tab" data-category="text">Text</button>
                <button class="category-tab" data-category="files">Files</button>
                <button class="category-tab" data-category="validation">Validation</button>
                <button class="category-tab" data-category="security">Security</button>
                <button class="category-tab" data-category="dates">Dates</button>
            </div>
            <div id="patternsContainer" class="examples-grid"></div>
        </div>

        <div class="pattern-section">
            <div class="pattern-input-wrapper">
                <label for="regexPattern">Regular Expression:</label>
                <div class="pattern-input-group">
                    <span class="pattern-delimiter">/</span>
                    <input type="text" id="regexPattern" placeholder="Enter regex pattern..." spellcheck="false">
                    <span class="pattern-delimiter">/</span>
                    <input type="text" id="regexFlags" class="flags-input" placeholder="flags" maxlength="6" spellcheck="false">
                </div>
            </div>

            <div class="flags-section">
                <label>Flags:</label>
                <div class="flags-checkboxes">
                    <div class="flag-option">
                        <input type="checkbox" id="flagG" value="g">
                        <label for="flagG">g (global)</label>
                    </div>
                    <div class="flag-option">
                        <input type="checkbox" id="flagI" value="i">
                        <label for="flagI">i (case-insensitive)</label>
                    </div>
                    <div class="flag-option">
                        <input type="checkbox" id="flagM" value="m">
                        <label for="flagM">m (multiline)</label>
                    </div>
                    <div class="flag-option">
                        <input type="checkbox" id="flagS" value="s">
                        <label for="flagS">s (dotAll)</label>
                    </div>
                    <div class="flag-option">
                        <input type="checkbox" id="flagU" value="u">
                        <label for="flagU">u (unicode)</label>
                    </div>
                </div>
            </div>

            <div class="error-display" id="errorDisplay"></div>
        </div>

        <div class="regex-main-content">
            <div class="left-column">
                <div class="test-section">
                    <div class="test-input-wrapper">
                        <label for="testString">Test String:</label>
                        <textarea id="testString" placeholder="Enter text to test against the regex..."></textarea>
                    </div>
                </div>

                <div class="results-section">
                    <div class="results-header">
                        <h3>Results</h3>
                        <span id="matchCount" class="match-count">0 matches</span>
                    </div>
                    <div id="highlightedText" class="highlighted-text"></div>
                    <div id="matchDetails" class="match-details"></div>
                </div>
            </div>

            <div class="right-column">
                <div class="replace-section">
                    <h3>Replace</h3>
                    <div class="replace-controls">
                        <input type="text" id="replaceString" placeholder="Replacement string..." spellcheck="false">
                        <button id="replaceBtn" class="format-btn">Test Replace</button>
                    </div>
                    <div class="replace-result-wrapper">
                        <label>Result:</label>
                        <div id="replaceResult" class="replace-result"></div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="../../src/theme-manager.js"></script>
    <script src="../../src/funcs.js"></script>
    <script src="regex-app.js"></script>
